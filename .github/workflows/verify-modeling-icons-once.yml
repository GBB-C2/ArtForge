name: Verify modeling icons
on:
  push:
    branches: [codex/modeling-tool-icons]
    paths: [.github/workflows/verify-modeling-icons-once.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the exact public revision
        shell: bash
        run: |
          git init -q .
          git fetch --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Build ArtForge and test its modeling icons
        run: |
          cargo test --locked -p artforge --bin artforge modeling_icons_follow
          cargo test --locked -p artforge --bin artforge every_vector_icon_is_visible_finite_bounded_and_independent_of_font_at_each_dpi
