[package]
name = "artforge"
description = "ArtForge Studio — 3D artwork creation"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
poseforge-core = { path = "../core" }
poseforge-io = { path = "../io" }
poseforge-render = { path = "../render" }
poseforge-simulation = { path = "../simulation" }
winit = "=0.30.12"
glam = { version = "=0.29.3", features = ["serde"] }
pollster = "=0.4.0"
serde = "1"
serde_json = "1"
arboard = { version = "=3.6.1", default-features = false }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell_Common"] }

